# ci.yml — GitHub Actions: run the full test suite, and package the extension, on every pull
# request and on main.
#
# Layer: tooling. Mirrors what a developer runs locally: `npm test` (typecheck, lint, unit,
# git tests — the git tests run a real git-spice, installed below), `npm run package` (so a
# manifest or README problem vsce would refuse shows up here, not at tag time — release.yml is
# the one that ships the .vsix) and then the extension-host tests, on both Linux and macOS. VS Code needs a display; on Linux `xvfb-run`
# fakes one. The VS Code download is cached so it is not fetched on every run. Plan: §9.5.
name: CI

# Pull requests cover every stacked branch; the push trigger is for main only, so a push to
# a PR branch runs the suite once (the pull_request event), not twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The git-spice the real-git-spice files run against (test/git/gitspice*.git.test.ts, M5
      # item 22b; plan §9.4, §9.6 (b)). One pin, bumped on purpose: change the number here, read
      # those files' run on both runners, and add the new version to plan §13.4's item-22b bullet
      # when it is green (the reading order names no version, so it needs no edit). It is not the
      # extension's floor — that is MINIMUM_GS_VERSION in src/core/backends/gitspice.ts, which the
      # unit tests hold through fakes — it is the version a user installing today gets, and one of
      # the two the item-22 facts were measured on.
      GIT_SPICE_VERSION: 0.32.0
      # With this set the real-git-spice files fail, by name, when git-spice is not on PATH,
      # instead of skipping: a broken install step cannot pass as "skipped" here.
      PRCASCADE_REQUIRE_GS: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # git-spice, so the real-git-spice files run here and not only on a developer's Mac (plan
      # §9.5; D5 closed in item 22b). The release tarball on both runners rather than `brew
      # install git-spice` on macOS: brew gives whatever version the formula has that day, runs
      # its own update first, and would be a second code path; the tarball is pinned, 6 MB and
      # about a second, with the same lines on both legs. The asset is named after `uname` —
      # `Linux-x86_64` on ubuntu-latest, `Darwin-arm64` on macos-latest, and `Linux-aarch64` /
      # `Darwin-x86_64` exist — so one line covers every runner the project could use. Its
      # sha256 is checked against the release's own checksums.txt before anything is unpacked: a
      # truncated or tampered download fails the job here, not in a test. Everything lands in
      # $RUNNER_TEMP, outside the checkout, so no tarball sits in the working tree for vsce or a
      # test to find. `shell: bash` is spelled out for `pipefail` — the default `bash -e` would
      # let a failing `grep` hide behind `shasum`. $GITHUB_PATH prepends the directory for every
      # later step, so `npm test` finds `git-spice` by name, the way the extension does from
      # VS Code's PATH. Not cached: the download is as quick as a cache restore would be.
      - name: Install git-spice
        shell: bash
        run: |
          asset="git-spice.$(uname -s)-$(uname -m).tar.gz"
          base="https://github.com/abhinav/git-spice/releases/download/v${GIT_SPICE_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o "$asset" "$base/$asset"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o checksums.txt "$base/checksums.txt"
          grep " ${asset}\$" checksums.txt | shasum -a 256 --check -
          mkdir -p git-spice
          tar -xzf "$asset" -C git-spice git-spice
          echo "$RUNNER_TEMP/git-spice" >> "$GITHUB_PATH"
          git-spice/git-spice --version | head -1

      # `npm ci` installs exactly what package-lock.json says, unlike `npm install`.
      # `--ignore-scripts` stops every package's install-time scripts from running: a
      # compromised dependency's preinstall hook is the classic supply-chain attack, and
      # plan §11.3 already makes "no install scripts" a floor for anything we depend on.
      # Nothing here needs one — esbuild's platform binary arrives as an optional
      # dependency, not through a script (verified: build, every suite and `vsce package`
      # pass with the flag).
      - run: npm ci --ignore-scripts

      - run: npm test

      # Packaging is part of every run: vsce validates the manifest (including that
      # @types/vscode is not newer than engines.vscode) and the README's links and images, and
      # refuses on a problem here rather than on the release tag. A missing LICENSE or
      # `repository` is only a warning on a runner: vsce answers its own "continue? [y/N]"
      # prompt with yes when stdout is not a terminal. The .vsix it writes is gitignored and
      # discarded.
      - run: npm run package

      # The extension-host tests download VS Code (~300 MB) into .vscode-test/; keep it
      # between runs. .vscode-test.mjs asks for 'stable', so the cache key must be the
      # version 'stable' means today (from the same update API test-cli asks): a key that
      # never changed would restore an old VS Code on every run and download the new one
      # anyway, because actions/cache saves only when the key was a miss.
      - name: Resolve the current VS Code stable version
        id: vscode
        # `-L` follows redirects; `--proto '=https'` refuses to follow one that leaves HTTPS,
        # so a hijacked redirect cannot hand us a version string over plain HTTP.
        run: echo "version=$(curl -fsSL --proto '=https' --tlsv1.2 https://update.code.visualstudio.com/api/releases/stable | jq -r '.[0]')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          # Only the download itself, not user-data/ (the launched VS Code's profile).
          path: .vscode-test/vscode-*
          key: vscode-test-${{ runner.os }}-${{ steps.vscode.outputs.version }}

      - name: Extension-host tests (Linux, under a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:ext

      - name: Extension-host tests (macOS)
        if: runner.os == 'macOS'
        run: npm run test:ext
